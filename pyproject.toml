[project]
name = "kyc-maker-agent"
version = "0.1.0"
description = "Autonomous KYC Maker AI Agent for Automated Compliance & Due Diligence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
